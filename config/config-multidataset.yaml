datasets: ["picarus", "pargus", "csemiargus"]

picarus:
  samples: "config/samples_picarus.tsv"
  units: "config/units.tsv"
  reference: "resources/refs/ilPolIcar1.1_genomic.fna"
pargus:
  samples: "config/samples_csemiargus.tsv"
  units: "config/units.tsv"
  reference: "resources/refs/ilPleArgu1.3_genomic.fna"
csemiargus:
  samples: "config/samples_csemiargus.tsv"
  units: "config/units.tsv"
  reference: "resources/refs/ilCyaSemi1.1_genomic.fna"

mapping:
